<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241016" />
    <meta name="description" content="A little birthday surprise for my favorite person." />
    <title>For my favorite person — 27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-glow hero-glow-one" aria-hidden="true"></div>
        <div class="hero-glow hero-glow-two" aria-hidden="true"></div>
        <nav class="nav" aria-label="Main navigation">
          <a class="wordmark" href="#top" aria-label="Back to the beginning">for you<span>♡</span></a>
          <span class="nav-note">a tiny corner of the internet</span>
        </nav>

        <div class="hero-content" id="top">
          <p class="eyebrow"><span class="eyebrow-line"></span> september 24 <span class="eyebrow-line"></span></p>
          <h1 id="page-title">Happy <em>27th</em>,<br /><span>my love.</span></h1>
          <p class="hero-copy">From our first hello to every day since, you’ve been my favorite person. I hope your birthday is as lovely as you are.</p>
          <p class="signoff">All my love <span aria-hidden="true">♡</span></p>
          <div class="photo-grid" role="group" aria-label="Photos of us">
            <img src="assets/photo-1.jpg" alt="A kiss on the cheek" loading="lazy" decoding="async" />
            <img src="assets/photo-2.jpg" alt="Smiling together" loading="lazy" decoding="async" />
            <img src="assets/photo-3.jpg" alt="Our hands making a heart" loading="lazy" decoding="async" />
            <img src="assets/photo-4.jpg" alt="Together with a rose" loading="lazy" decoding="async" />
          </div>
        </div>
      </section>
    </main>
